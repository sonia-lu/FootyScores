name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Run in the official Python image instead of installing Python on the
    # runner: newer runners no longer offer old versions such as 3.9.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (see README) and a current one.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python -m unittest discover -s tests -v
